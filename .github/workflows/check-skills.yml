name: Check skills
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-checks.txt
      - run: python -B tools/checks.py --output-dir .scratch/ci-verification
      - name: Check Test Point Discovery
        run: python -B -m unittest discover -s tests/test-point-discovery
      - run: python -m pip install -r skills/ui-test/requirements.lock
      - name: Check UI-Test case authoring and publication
        working-directory: skills/ui-test
        run: >-
          python -B -m pytest -q -p no:cacheprovider
          tests --junitxml=../../.scratch/ci-verification/ui-test-authoring.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: .scratch/ci-verification/
          include-hidden-files: true
          if-no-files-found: error
